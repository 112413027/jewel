<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>Bakery Shop</title>
    <link rel="stylesheet" href="bakery12.css">

<body>

    <div class="product-container">
    <div class="product-card" data-id="bakery_001" data-name="Piece Cake" data-price="80.00">
        <img src="piececake.jpg" alt="Piece Cake" class="product-img">
        <h2 class="product-title">Piece Cake</h2>
        <p class="product-price">₹80.00</p>
        
        <!-- Validation & Input Controls -->
        <div class="order-controls">
            <label for="qty-001">Quantity (Max 10):</label>
            <input type="number" id="qty-001" class="item-qty" value="1" min="1" max="10">
            <span class="error-msg" id="error-001"></span>
        </div>

        <button class="add-to-cart-btn">Add to Cart</button>
    </div>
