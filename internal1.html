<!DOCTYPE html>
<html>
<head>
    <title>Mobile Number Directory</title>

    <style>
        body{
            font-family: Arial;
            background:#f2f2f2;
        }

        .box{
            width:400px;
            margin:80px auto;
            background:white;
            padding:20px;
            border-radius:5px;
            text-align:center;
        }

        input[type=text]{
            width:90%;
            padding:10px;
            margin:10px;
        }

        input[type=submit]{
            padding:10px 20px;
            background:green;
            color:white;
            border:none;
            cursor:pointer;
        }

        input[type=submit]:hover{
            background:darkgreen;
        }
    </style>

</head>
<body>

<div class="box">

<h2>Mobile Number Directory</h2>

<form action="internal1.php" method="post">

<input type="text" name="mobile" placeholder="Enter 10-Digit Mobile Number"
            maxlength="10"
            pattern="[0-9]{10}"
            inputmode="numeric"
            oninput="this.value=this.value.replace(/[^0-9]/g,'')"
            required>>

<br>

<input type="submit" value="Search">

</form>

</div>

</body>
</html>
